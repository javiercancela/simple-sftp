# UNTESTED: written on a Linux box without access to GitHub runners.
# Builds and smoke-tests on matching-OS runners (spec 11). Unsigned dev builds.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      # A failed or cancelled OS must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04 # Linux x64: .deb + .zip
          # macos-14 (arm64) is retired 2026-11-02. During the 2026-11-01 brownout
          # GitHub cancels the job in about a second with no steps:
          # https://github.com/actions/runner-images/issues/13518
          # macos-15 is the current arm64 image.
          - os: macos-15 # macOS arm64: .dmg + .zip
          - os: macos-15-intel # macOS x64: .dmg + .zip (macos-13 was retired Dec 2025; Intel runners end Aug 2027)
          - os: windows-latest # Windows x64: Squirrel installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install OpenSSH server + xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + OpenSSH integration tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Unit tests only (no unprivileged sshd fixture on Windows yet)
        if: runner.os == 'Windows'
        run: npm run test:unit
      - name: OpenSSH integration, Electron e2e, and packaged smoke are skipped on Windows
        if: runner.os == 'Windows'
        run: echo "Skipped on Windows. This runner has no unprivileged sshd fixture, so real-sshd integration, Electron e2e, and packaged smoke do not run. Unit tests, lint, typecheck, and the installer build still run."
      # GitHub's macOS runners intermittently fail `hdiutil detach /Volumes/SimpleSFTP`
      # with "No such file or directory" after DiskArbitration drops the image.
      # appdmg only retries exit code 16, so the whole make is retried on Darwin.
      - name: Build installers
        shell: bash
        run: |
          set -uo pipefail
          attempt=1
          while true; do
            if npm run make; then
              exit 0
            fi
            status=$?
            if [ "$(uname -s)" != Darwin ] || [ "$attempt" -ge 3 ]; then
              exit "$status"
            fi
            echo "make failed (attempt ${attempt}). Retrying after hdiutil detach flake."
            hdiutil detach /Volumes/SimpleSFTP >/dev/null 2>&1 || true
            rm -rf out/make
            attempt=$((attempt + 1))
          done
      - name: Electron UI end-to-end (real sshd)
        if: runner.os != 'Windows'
        run: npm run test:e2e
      - name: Packaged smoke (smoke build + release artifact checks)
        if: runner.os != 'Windows'
        run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: simple-sftp-${{ matrix.os }}
          path: out/make/**
